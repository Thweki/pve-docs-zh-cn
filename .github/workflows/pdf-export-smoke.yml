name: PDF export smoke

on:
  pull_request:
    paths:
      - 'scripts/export_pdf.py'
      - 'export-assets/**'
      - 'requirements-export.txt'
      - 'tests/**'
      - '.github/workflows/pdf-export-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-export-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pdf-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-export.txt
      - name: Install rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libpango-1.0-0 libpangoft2-1.0-0 poppler-utils
          python -m pip install -r requirements.txt -r requirements-export.txt
      - name: Test preprocessing, section text and rendered PDF
        env:
          PVE_PDF_REQUIRE_DEPS: '1'
        run: timeout 180s python -m unittest discover -s tests -v
